# PostgreSQL for local development. Start it with: docker compose up -d
# Card decks and finished matches are kept here; live rooms stay in the server's memory
services:
  db:
    # 18 rather than the brand new 19, to match what free hosts offer
    image: postgres:18-alpine
    environment:
      # Only for this local database, never for a hosted one
      POSTGRES_USER: rustyparty
      POSTGRES_PASSWORD: rustyparty
      POSTGRES_DB: rustyparty
    ports:
      # Reachable from this computer only
      - "127.0.0.1:5432:5432"
    volumes:
      # From version 18 the data lives in a folder per version under this path
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rustyparty -d rustyparty"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data: